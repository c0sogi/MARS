[project]
name = "mars"
version = "0.1.0"
description = "MARS: Modular Agent with Reflective Search for Automated AI Research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.2.0"]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
all = [
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
]


[dependency-groups]
dev = ["iruff>=0.1.0", "pyright>=1.1.408", "ruff>=0.15.0", "pytest>=8.0"]

[tool.pyright]
typeCheckingMode = "standard"
exclude = ["exp-logs", ".venv"]

[tool.ruff]
line-length = 120
exclude = ["exp-logs", ".venv"]
